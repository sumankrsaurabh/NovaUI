name: Bug report
description: Report a reproducible NovaUI problem
title: "[Bug]: "
body:
  - type: input
    id: version
    attributes:
      label: NovaUI version or commit
      placeholder: 0.1.0 or commit hash
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and operating system
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest code and steps that reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: sensitive
    attributes:
      label: Privacy check
      options:
        - label: I removed passwords, tokens, personal data, and private files from this report.
          required: true
