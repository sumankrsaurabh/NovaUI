name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check novaui tests examples packaging
      - name: Test
        run: python -m pytest -q
      - name: Check frontend syntax
        run: node --check novaui/frontend/app.js
      - name: Check CLI and import
        run: |
          novaui --version
          novaui --help
          python -c "import novaui; assert novaui.__version__"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build and validation tools
        run: python -m pip install build twine
      - name: Build source and wheel distributions
        run: python -m build --sdist --wheel
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Verify installed wheel resources and CLI
        run: |
          python -m pip install --no-deps --target "$RUNNER_TEMP/novaui-wheel" dist/*.whl
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/novaui-wheel" python -c "import importlib.metadata as m, importlib.resources as r, novaui; assert r.files('novaui').joinpath('frontend/app.js').is_file(); assert any(e.name == 'novaui' for e in m.distribution('novaui').entry_points.select(group='console_scripts')); print(novaui.__version__)"
          PYTHONPATH="$RUNNER_TEMP/novaui-wheel" python -c "from novaui import App, Text; assert App(Text('wheel smoke')).serialize_tree()['root']['text'] == 'wheel smoke'"
          PYTHONPATH="$RUNNER_TEMP/novaui-wheel" python -m novaui --version
      - name: Upload Python distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: novaui-python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install audited extras and scanner
        run: |
          python -m pip install -e ".[desktop,desktop-qt,dev]"
          python -m pip install pip-audit
      - name: Audit installed dependencies
        run: pip-audit
